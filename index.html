:root{--bg:#faf8f4;--fg:#1d1b18;--mut:#6b665e;--line:#e2ddd3;--acc:#8a3b12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--fg:#ece8df;--mut:#9a948a;--line:#2e2b26;--acc:#e0915f}}
:root[data-theme="dark"]{--bg:#161512;--fg:#ece8df;--mut:#9a948a;--line:#2e2b26;--acc:#e0915f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.65 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:56px 22px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 4px}
#themeBtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;padding:0;transition:color .2s,border-color .2s}
#themeBtn:hover{color:var(--acc);border-color:var(--acc)}
#themeBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:2rem;font-weight:400;margin:0}
.sub{color:var(--mut);margin:0 0 28px}
h2{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:400;border-top:1px solid var(--line);padding-top:18px;margin:44px 0 14px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.row{display:flex;gap:16px;justify-content:space-between;margin:0 0 18px}
.row b{font-weight:400}.when{color:var(--mut);font-size:.9rem;white-space:nowrap}
.row p{margin:2px 0 0;color:var(--mut);font-size:.95rem}
.tags span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 12px;margin:0 6px 8px 0;font-size:.85rem}
.certbtn{background:none;border:0;padding:0;font:inherit;font-size:.95rem;color:var(--acc);text-decoration:underline;cursor:pointer;text-align:left}
.certbtn b{font-weight:400}
.chev{display:inline-block;text-decoration:none;transition:transform .3s;font-size:.8em;color:var(--mut)}
.certbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease;margin-top:-6px}
.reveal.open{grid-template-rows:1fr}
.reveal>div{overflow:hidden}
.reveal img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;margin:4px 0 20px}
.upd{font-size:.9rem;color:var(--mut)}
footer{margin-top:56px;color:var(--mut);font-size:.8rem}
@media (max-width:480px){.row{flex-direction:column;gap:0}}
</style>

<header class="top"><h1>${esc(DATA.name)}</h1><button id="themeBtn" type="button" aria-label="Switch between light and dark mode"></button></header>
<p class="sub">${esc(DATA.tagline)}</p>
<p>${esc(DATA.about)}</p>
<h2>Now <span class="upd">· updated ${esc(DATA.updated)}</span></h2>
<ul>${DATA.now.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
<h2>Experience</h2>${rows(DATA.experience)}
<h2>Projects</h2>${rows(DATA.projects)}
<h2>Education</h2>${rows(DATA.education)}
<h2>Certifications</h2>${DATA.certifications.map(c=>`<div class="row"><div><button class="certbtn" aria-expanded="false"><b>${esc(c.role)}</b>, ${esc(c.org)} <span class="chev">▾</span></button> · <a href="${esc(c.href)}" target="_blank" rel="noopener">Verify</a></div><div class="when">${esc(c.when)}</div></div><div class="reveal"><div>${IMGS[c.img]?`<img src="${IMGS[c.img]}" alt="${esc(c.role)} certificate">`:""}</div></div>`).join("")}
<h2>Skills</h2><div class="tags">${DATA.skills.map(s=>`<span>${esc(s)}</span>`).join("")}</div>
<h2>Contact</h2><p>${DATA.links.map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join(" · ")}</p>
<footer>© ${new Date().getFullYear()} ${esc(DATA.name)}</footer>`;
const root=document.documentElement;
const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const curTheme=()=>root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
try{const sv=localStorage.getItem("theme");if(sv==="light"||sv==="dark")root.setAttribute("data-theme",sv)}catch(e){}
const tb=document.getElementById("themeBtn");
const paint=()=>{tb.innerHTML=curTheme()==="dark"?SUN:MOON};
paint();
tb.addEventListener("click",()=>{const n=curTheme()==="dark"?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("theme",n)}catch(e){}paint()});
document.querySelectorAll(".certbtn").forEach(b=>b.addEventListener("click",()=>{const r=b.closest(".row").nextElementSibling;const o=r.classList.toggle("open");b.setAttribute("aria-expanded",o)}));
</script>
</body>
</html>
